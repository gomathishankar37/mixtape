kind = "web"
previewPath = "/"
title = "🌻 For the Smile I Like 🌚"
version = "1.0.0"
id = "artifacts/mixtape"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20025

[services.development]
run = "pnpm --filter @workspace/mixtape run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mixtape", "run", "build" ]
serve = "static"
publicDir = "artifacts/mixtape/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20025"
BASE_PATH = "/"
